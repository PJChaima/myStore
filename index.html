<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6efe2">
<title>ร้านยาจำลอง | หน้าแรก</title>
<style>
  :root{--bg:#f6efe2;--card:#ffffff;--card-hover:#fffaf1;--line:#e4d9c4;--text:#1d3b3a;--muted:#5f6f6c;--green:#0b7a74;--sea:#2bb3a7}
  *{box-sizing:border-box}
  /* ใช้ Noto Sans Thai ที่มีในเครื่อง ไม่โหลดฟอนต์จากภายนอก */
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
       font:16px/1.6 'Noto Sans Thai',system-ui,'Segoe UI',Tahoma,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:32px 18px 40px}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
  .brand-icon{flex:none;width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;
              display:grid;place-items:center;font-size:28px;font-weight:900}
  h1{margin:0;font-size:24px;line-height:1.3}
  .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
  .notice{margin:0 0 22px;padding:12px 16px;border-radius:12px;background:#fff3c4;border:1px solid #e6c65c;
          color:#5a4300;font-size:15px;font-weight:600}
  nav ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  .link{display:flex;align-items:center;gap:14px;min-height:76px;padding:16px 18px;border-radius:16px;
        background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;
        box-shadow:0 6px 18px rgba(60,45,20,.06);transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  .link:hover{background:var(--card-hover);border-color:var(--sea)}
  .link:active{background:#eef8f6;border-color:var(--green)}
  .link:focus-visible{outline:3px solid var(--green);outline-offset:3px}
  .num{flex:none;width:36px;height:36px;border-radius:50%;background:#dff3f0;color:var(--green);
       display:grid;place-items:center;font-weight:800;font-size:15px}
  .text{flex:1;min-width:0}
  .title{display:block;font-size:18px;font-weight:700;line-height:1.35}
  .desc{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px}
  .arrow{flex:none;color:var(--green);font-size:22px;font-weight:700}
  footer{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
  @media(min-width:700px){.wrap{padding-top:56px}h1{font-size:28px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <span class="brand-icon" aria-hidden="true">+</span>
    <div>
      <h1>ร้านยาจำลอง</h1>
      <p class="sub">Workshop ระบบร้านยา · เลือกหน้าที่ต้องการใช้งาน</p>
    </div>
  </header>

  <p class="notice" role="note">⚠ ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p>

  <nav aria-label="เมนูหลัก"><ul id="menu"></ul></nav>

  <footer>ข้อมูลจำลองเพื่อการเรียนเท่านั้น</footer>
</main>

<script>
'use strict';
// รายการลิงก์ในหน้าแรก: เพิ่มหรือลบปุ่มได้ด้วยการแก้หนึ่งบรรทัด (เรียงตามลำดับที่แสดง)
// ปุ่มที่ชี้ไปหน้าที่ยังไม่ได้สร้างจะขึ้น 404 จนกว่าจะ push ไฟล์นั้น
const LINKS = [
  { href: 'pos.html',       title: 'หน้าขายยา',              desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
  { href: 'admin.html',     title: 'จัดการระบบ (ผู้ดูแล)',     desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
  { href: 'dashboard.html', title: 'Dashboard คลังยา',       desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
  { href: 'status.html',    title: 'ตรวจสถานะระบบ',          desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
];

// สร้างปุ่มด้วย createElement และ textContent ข้อความจากอาร์เรย์จึงไม่ถูกตีความเป็น HTML
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const menu = document.getElementById('menu');
LINKS.forEach((link, i) => {
  const a = el('a', 'link');
  a.href = './' + link.href;
  const num = el('span', 'num', String(i + 1));
  num.setAttribute('aria-hidden', 'true');
  const text = el('span', 'text');
  text.append(el('span', 'title', link.title), el('span', 'desc', link.desc));
  const arrow = el('span', 'arrow', '›');
  arrow.setAttribute('aria-hidden', 'true');
  a.append(num, text, arrow);
  const li = el('li');
  li.append(a);
  menu.append(li);
});
</script>
</body>
</html>
